# Configuration d'AgentFly pour PCCheck (issues étiquetées « agentflySucettes » → pull requests).
# Le conteneur d'AgentFly (Ubuntu 24.04, Node 22, Python, compilateur C) n'a pas Rust : « setup »
# l'installe dans le dossier de l'utilisateur, sans droits administrateur. L'application Tauri
# elle-même (crate pccheck-app) exige des bibliothèques graphiques absentes du conteneur : elle
# est exclue ici, et la CI du dépôt la vérifie sur chaque pull request (Windows et Linux).

baseBranch: master

setup: >-
  export PATH="$HOME/.cargo/bin:$PATH" &&
  (command -v cargo >/dev/null ||
  curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
  sh -s -- -y --profile minimal --default-toolchain stable -c clippy,rustfmt) &&
  npm ci --prefix app

build: npm run build --prefix app

test: >-
  export PATH="$HOME/.cargo/bin:$PATH" &&
  cargo test --workspace --exclude pccheck-app &&
  (cd app && npx tsc --noEmit)

lint: >-
  export PATH="$HOME/.cargo/bin:$PATH" &&
  cargo fmt --all -- --check &&
  cargo clippy --workspace --exclude pccheck-app --all-targets -- -D warnings

# Vidéo de démonstration : hors de Tauri, l'interface passe d'elle-même en mode démo (données
# fictives de app/src/demo/, bandeau « Mode démonstration ») ; le serveur Vite suffit, sans
# Rust ni droits administrateur. Port fixe (strictPort dans vite.config.ts).
app:
  start: npm run dev --prefix app -- --host 0.0.0.0
  url: http://localhost:5173
  ready:
    httpGet: /
    timeoutSec: 90

demo:
  kind: browser
  viewport: { width: 1440, height: 900 }
