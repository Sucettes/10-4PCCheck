# Mises à jour de dépendances proposées par pull request, une fois par semaine, regroupées pour
# éviter une PR par paquet. Les PR visent dev, comme toute modification : elles sont vérifiées
# par la CI avec le reste, à la PR dev → master.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    labels: ["dépendances"]
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /app
    target-branch: dev
    labels: ["dépendances"]
    schedule:
      interval: weekly
    groups:
      interface:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    labels: ["dépendances"]
    schedule:
      interval: weekly
