name: Release

# Chaque arrivée sur master (fusion de dev) publie une release : builds optimisés au maximum
# (profil release : LTO complet, une seule unité de compilation), Windows et Linux en parallèle.
# Les tests ne sont pas relancés : ils ont passé sur la PR dev → master (verification.yml), seule
# porte d'entrée de master.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Un groupe par commit, jamais annulé ni remplacé : chaque fusion publie sa release, même si une
# autre arrive pendant le build.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # Brouillon créé d'abord : les deux builds y joignent leur paquet en parallèle.
  brouillon:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Release (brouillon)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci/release.sh create

  # AppImage Linux, construite sur Ubuntu 22.04 (glibc 2.35) pour la compatibilité.
  build-linux:
    runs-on: ubuntu-22.04
    needs: brouillon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Dépendances système Tauri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb
      - run: tools/build-smartctl-linux.sh
      - name: Build AppImage
        working-directory: app
        env:
          NO_STRIP: "true"
        run: |
          npm ci
          npx tauri build --bundles appimage
      # Pas un test du code : vérifie que le paquet produit démarre avant de le publier.
      - name: Autotest de l'AppImage
        run: |
          mkdir -p usb/linux
          cp target/release/bundle/appimage/*.AppImage usb/linux/PCCheck.AppImage
          chmod +x usb/linux/PCCheck.AppImage
          timeout 120 xvfb-run -a usb/linux/PCCheck.AppImage --self-test "$PWD/selftest-linux.json"
          cat selftest-linux.json
          jq -e '.ok == true and .appInfo.smartctl.status == "ready"' selftest-linux.json
      - name: Joindre l'AppImage à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp usb/linux/PCCheck.AppImage PCCheck-linux.AppImage
          bash tools/ci/release.sh upload PCCheck-linux.AppImage

  # Exécutable Windows portable et paquet complet de la clé.
  build-windows:
    runs-on: windows-latest
    needs: brouillon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: smartctl.exe (smartmontools via Chocolatey)
        shell: pwsh
        run: |
          choco install smartmontools -y --no-progress | Out-Null
          $src = "C:\Program Files\smartmontools\bin\smartctl.exe"
          if (-not (Test-Path $src)) { throw "smartctl.exe introuvable après installation" }
          New-Item -ItemType Directory -Force tools\windows | Out-Null
          Copy-Item $src tools\windows\smartctl.exe
          & tools\windows\smartctl.exe --version | Select-Object -First 1
      - name: Build (exécutable seul, sans installateur)
        working-directory: app
        run: |
          npm ci
          npx tauri build --no-bundle
      - name: Vérifier le manifeste requireAdministrator
        shell: pwsh
        run: |
          $mt = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\mt.exe" | Sort-Object FullName | Select-Object -Last 1
          & $mt.FullName -nologo "-inputresource:target\release\pccheck.exe;#1" "-out:manifest.xml"
          Get-Content manifest.xml
          if (-not (Select-String -Path manifest.xml -Pattern 'level="requireAdministrator"' -Quiet)) { throw "requireAdministrator absent du manifeste" }
          if (-not (Select-String -Path manifest.xml -Pattern 'Microsoft.Windows.Common-Controls' -Quiet)) { throw "Common-Controls absent du manifeste" }
      - name: Assembler le dossier portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force usb\windows\tools | Out-Null
          Copy-Item target\release\pccheck.exe usb\windows\PCCheck.exe
          Copy-Item tools\windows\smartctl.exe usb\windows\tools\smartctl.exe
      # Pas un test du code : vérifie que l'exécutable produit démarre avant de le publier.
      - name: Autotest
        shell: pwsh
        run: |
          $out = "$PWD\selftest-windows.json"
          $p = Start-Process -FilePath usb\windows\PCCheck.exe -ArgumentList "--self-test", "`"$out`"" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "autotest : délai dépassé" }
          Write-Host "code de sortie : $($p.ExitCode)"
          if (-not (Test-Path $out)) { throw "autotest : aucun rapport écrit" }
          $r = Get-Content $out -Raw | ConvertFrom-Json
          if (-not $r.ok) { throw "autotest en échec" }
          if ($r.appInfo.smartctl.status -ne "ready") { throw "smartctl non prêt" }
      - name: Outils de la clé (adb, PhotoRec, TestDisk, The Sleuth Kit)
        shell: pwsh
        run: ./tools/fetch-tools-windows.ps1
      - name: Paquet de la clé (Windows)
        shell: pwsh
        run: |
          ./tools/assemble-usb.ps1
          Compress-Archive -Path dist-usb\* -DestinationPath PCCheck-windows.zip
          Get-Item PCCheck-windows.zip | Select-Object Name, Length
      - name: Joindre le paquet Windows à la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci/release.sh upload PCCheck-windows.zip

  # Wiki GitHub publié depuis docs/wiki/ (source de vérité, versionnée avec le code).
  wiki:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Publier docs/wiki sur le wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          # Le wiki reflète exactement docs/wiki : une page supprimée du dépôt disparaît aussi.
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r docs/wiki/. wiki/
          cd wiki
          git add -A
          if git diff --cached --quiet; then echo "wiki déjà à jour"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Documentation : ${GITHUB_SHA::7}"
          git push -q
          echo "wiki publié"

  # Publication : seulement si les deux builds ont réussi.
  release:
    runs-on: ubuntu-22.04
    needs: [build-linux, build-windows]
    steps:
      - uses: actions/checkout@v4
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci/release.sh publish
