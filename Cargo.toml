[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/inventory",
    "crates/android",
    "crates/report",
    "crates/recovery",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
