[package]
name = "pccheck-inventory"
description = "PCCheck : inventaire matériel, batterie, sécurité Windows, test de charge CPU et test RAM partiel."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pccheck-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
# Requêtes WMI désérialisées avec serde. Sans chrono : les dates CIM sont lues comme texte.
wmi = { version = "0.18", default-features = false }
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }
